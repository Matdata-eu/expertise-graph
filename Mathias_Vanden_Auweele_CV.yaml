    projects:
    - date: Data platform
      name: '[Asset360](https://expertise.matdata.eu/\#/page/Asset360)'
      highlights:
      - A data platform combining all asset data, setting the golden record and creating
        the foundation for a data centric landscape.
      - '**Roles**: Business analyst, Product owner'
      - '**Technologies**: Airflow, Apache Jena Fuseki, Data centricity, Data governance,
        Dbeaver, Postgresql, Python, Railway'
    - date: Image processing
      name: '[Asset recognition on images from measurement train](https://expertise.matdata.eu/\#/page/Asset\%20recognition\%20on\%20images\%20from\%20measurement\%20train)'
      highlights:
      - A backend processing system to identify railway assets on pictures taken by
        camera's on measurement trains. The results help in creating inventories and
        manual digital inspection. The goal is to also categorize assets according
        to their state (health/worn..)
      - '**Roles**: Business analyst, Data analyst'
      - '**Technologies**: Dbeaver, Image recognition AI, Postgresql, Railway, S3'
    - date: Data processing
      name: '[Automated data pipelines](https://expertise.matdata.eu/\#/page/Automated\%20data\%20pipelines)'
      highlights:
      - A backend system to automate data transfers from several databases. Using
        several techniques such as delta transfer or ID based copying.
      - '**Roles**: Data analyst, Data architect, DevOps engineer, Developer'
      - '**Technologies**: Apache nifi, Dbeaver, Git, Gitlab CI CD, Kerberos, Loki,
        MSSQL, Openshift, Oracle, Postgresql, SAP HANA BIQ, SAS, Serilog'
    - date: Measurement system
      name: '[Camera inspection system for OCL](https://expertise.matdata.eu/\#/page/Camera\%20inspection\%20system\%20for\%20OCL)'
      highlights:
      - We installed over 16 camera's on a measurement train to inspect the overhead
        contact line system from multiple perspectives. The camera's are triggered
        based on distance travelled. The images are timestamped and the server time
        is synced with a Stratum 1 local NTP server. In post processing, the location
        of the images is calculated. The images are used for digital inspection of
        the system, both manual (using a webapp) and automatically (using AI).
      - '**Roles**: Project lead, Technician'
      - '**Technologies**: Camera, Laser, NTP, Railway, S3, SSH'
    - date: Webapp
      name: '[Change context management application](https://expertise.matdata.eu/\#/page/Change\%20context\%20management\%20application)'
      highlights:
      - A full stack application to manage change context inside the topology management
        system.
      - '**Roles**: Data architect, Product owner'
      - '**Technologies**: Apache Jena Fuseki, Git, Gitlab CI CD, Helm charts, Python,
        RDF, Railway, SHACL, SPARQL, VueJs'
    - date: Measurement system
      name: '[Contact wire thickness measurement system](https://expertise.matdata.eu/\#/page/Contact\%20wire\%20thickness\%20measurement\%20system)'
      highlights:
      - A hardware system using camera's and lasers mounted on a pantograph to measure
        the thickness of a wire. The results are very important to optimize maintenance
        and renewal and avoid catenary incidents.
      - '**Roles**: Business analyst, Data architect, Developer, Project lead'
      - '**Technologies**: Camera, Laser, Laser triangulation, Railway'
    - date: Measurement system
      name: '[Contact wire uplift measurement system](https://expertise.matdata.eu/\#/page/Contact\%20wire\%20uplift\%20measurement\%20system)'
      highlights:
      - A solar/battery powered hardware system mounted in the catenary, measuring
        the vertical movement of the contact wire at the passage of a train. Everything
        was designed, assembled, programmed, ... by myself.
      - '**Roles**: Business analyst, Developer'
      - '**Technologies**: Arduino, C++, Git, PCB design, Raspberry Pi'
    - date: Strategy
      name: '[Data centric strategy](https://expertise.matdata.eu/\#/page/Data\%20centric\%20strategy)'
      highlights:
      - An enterprise like a railway infrastructure manager, typically has a very
        siloed data/IT landscape. In order to make certain use cases possible, data
        has to be integrated between silo's. That's not always possible using existing
        systems and a spaghetti mess begins. And long term approach to data integration
        is defining a data centric strategy, meaning to create a data layer based
        on a single enterprise data model. This project set up several key requirements
        to becoming data centric. Reporting was done on director and enterprise level.
      - '**Roles**: Product owner, Project lead, SPOC data for department of 9000
        employees, Teacher, Teamlead'
      - '**Technologies**: Project management, Railway'
    - date: Data processing
      name: "[Data cube: linear phenomena's](https://expertise.matdata.eu/\\#/page/Data\\\
        %20cube\\%3A\\%20linear\\%20phenomena's)"
      highlights:
      - Linear assets and linear events typically have a start and an end position
        using a linear referencing system (kilometerpole position). For BI and operational
        systems, it is easier if these linear things are denormalised. A innovative
        model and process was thought out to calculate smallest linear segments with
        a unique set of properties (over 100 properties were thus defined).
      - '**Roles**: Business analyst, Data architect, Developer'
      - '**Technologies**: Dbeaver, Postgresql, Qlikview, Topology'
    - date: Measurement system
      name: '[Data integration of old track tamper machines](https://expertise.matdata.eu/\#/page/Data\%20integration\%20of\%20old\%20track\%20tamper\%20machines)'
      highlights:
      - Older tamping machines use a relative system for track tamping. That means
        that the position of the track is corrected based on it's current position,
        contrary to a absolute system were the design position is respected. In order
        to make evaluate the effectiveness of tamping and ensure the end quality,
        the measurements that are done on the machine are forwarded and combined with
        design parameters and other measurements. For this, a state of the art GNSS
        system was installed, the measurement computers were connected to an Azure
        server over SSH and data transfer is automated.
      - '**Roles**: Developer, Project lead, Technician'
      - '**Technologies**: Azure, GNSS, Reverse proxy, SSH'
    - date: Data processing
      name: '[Data integration: operational platform & track length](https://expertise.matdata.eu/\#/page/Data\%20integration\%3A\%20operational\%20platform\%20\%26\%20track\%20length)'
      highlights:
      - The data about operational length of tracks and platforms was a manually controlled
        inventory. This was laborious and not of high quality. This project had as
        goal to automatically calculate the operational length based on track topology,
        signal and platform locations. Integrating all the data into a common topology
        was the challenge.
      - '**Roles**: Data analyst, Data architect, Developer, SPOC data for department
        of 9000 employees'
      - '**Technologies**: Dbeaver, Plpgsql, PostGIS, Postgresql, PowerBI, Topology'
    - date: Semantic
      name: '[ERA RINF Chatbot](https://expertise.matdata.eu/\#/page/ERA\%20RINF\%20Chatbot)'
      highlights:
      - A proof of concept to show how RDF data together with an ontology can be used
        together with a LLM such as ChatGPT. The project result is a public web application
        where the user can ask questions in natural language and get a data result
        as output.
      - '**Roles**: DevOps engineer, Developer, Ontologist'
      - '**Technologies**: Azure, Docker, ERA ontology, Git, Gitlab CI CD, LLM & ChatGPT,
        OWL, Python, RDF, Streamlit'
    - date: Data processing
      name: '[Energy settlement data lookup](https://expertise.matdata.eu/\#/page/Energy\%20settlement\%20data\%20lookup)'
      highlights:
      - Energy settlement (responsible for a large part of the operational turnover
        of the company) is still done mainly using Excel. Several interfaces to existing
        JSON API services were added to the Excel file to add a higher level of automation
        to the system.
      - '**Roles**: Business analyst, Data architect, Developer'
      - '**Technologies**: Excel, JSON API, Power Query'
    - date: Strategy
      name: '[Enterprise data governance model](https://expertise.matdata.eu/\#/page/Enterprise\%20data\%20governance\%20model)'
      highlights:
      - In order to improve data deficiencies, the enterprise decided to review the
        current governance model and implement a new one. A high level strategic project
        started and data governance was discussed on multiple dimensions (structure,
        roles, governing bodies, policies, vision, ...). The project result has impact
        on the enterprise structure.
      - '**Roles**: Department representative, SPOC data for department of 9000 employees,
        Teamlead'
      - '**Technologies**: Data centricity, Data governance, Project management'
    - date: Semantic
      name: '[Enterprise data model](https://expertise.matdata.eu/\#/page/Enterprise\%20data\%20model)'
      highlights:
      - A very important element in an enterprise to avoid siloed data, is to have
        an enterprise data model by which the data (and applications..) are modelled.
        This ensures data interoperability from the start of the application. When
        dealing with legacy systems, starting an enterprise data model is not that
        easy. The goal of this project is setting up a team of experts that know the
        domain and are able to model the enterprise. In order to make the model as
        extensible as possible, semantic technologies were chosen. The model is published
        in different forms, among which is a Widoco internet site.
      - '**Roles**: DevOps engineer, Developer, Ontologist, SPOC data for department
        of 9000 employees, Teacher, Teamlead'
      - '**Technologies**: ERA ontology, Gist, Git, Gitlab CI CD, OWL, Protege, QUDT,
        RSM, RTM, RailML, SHACL, SHACL Play, SKOS, Widoco'
    - date: Measurement system
      name: '[GPS trackers for mobile safety equipment](https://expertise.matdata.eu/\#/page/GPS\%20trackers\%20for\%20mobile\%20safety\%20equipment)'
      highlights:
      - In order to reduce the number of "signals passed at danger", a project was
        launched to track in real time the location of safety equipment. A custom
        GPS tracker was designed and interfaced with the internal network over LTE.
      - '**Roles**: Business analyst, Developer, Project lead'
      - '**Technologies**: Binary, Firewall, GNSS, Git, Gitlab CI CD, JSON API, Traccar'
    - date: Data processing
      name: '[Inventory: OCL auxiliary tracks](https://expertise.matdata.eu/\#/page/Inventory\%3A\%20OCL\%20auxiliary\%20tracks)'
      highlights:
      - The legacy system to manage the electrified auxiliary tracks was not data
        centric. The goal of the project was to combine the available data such as
        the track topology and the sectioning of the OCL to create the inventory,
        resulting in a dramatically reduced workload.
      - '**Roles**: Data architect, Developer, Project lead'
      - '**Technologies**: Dbeaver, Plpgsql, PostGIS, Postgresql, QGIS, Qlikview,
        Topology'
    - date: Data processing
      name: '[Lightning detection alerting system](https://expertise.matdata.eu/\#/page/Lightning\%20detection\%20alerting\%20system)'
      highlights:
      - Lightning strikes on railway infrastructure can cause serious damage and is
        not always detected. There exist commercially available measurement systems
        that interface their data of the lightning strike location and strength. We
        interfaced with these datasources and mapped the location (with some business
        rules) on the rail network. An email system was put in place to notify the
        installation responsible person. A GIS webapp and dashboard were also developed.
      - '**Roles**: Data architect, Developer, Project lead'
      - '**Technologies**: Angular, Dbeaver, Docker, Git, Gitlab CI CD, Kerberos,
        Leaflet, MSSQL, Nginx, Openshift, PostGIS, Postgresql, QGIS, Qlikview'
    - date: Desktop app
      name: '[Linear measurement data viewer](https://expertise.matdata.eu/\#/page/Linear\%20measurement\%20data\%20viewer)'
      highlights:
      - Linear measurements used to be distribute on paper or sometimes pdf. Obviously,
        this does not allow for normal data analysis, let alone be a driver for predictive
        maintenance. For this project, a data platform was set up with an automatic
        data transfer from measurement system to storage, automatic loading of the
        measurement onto the data platform and alert creation according to business
        rules. Furthermore an analysis desktop tool was developed that allows to visualise
        the measurement on an interactive chart. Other features were also developed,
        such as an image viewer, lidar viewer, trend analysis, inventory viewer and
        management, event viewer, GIS viewer, GPS tracking, export, ...
      - '**Roles**: Business analyst, Data analyst, Data architect, DevOps engineer,
        Developer, Project lead'
      - '**Technologies**: Camera, ClickOnce, Dbeaver, GPSD, Git, Gitlab CI CD, Leaflet,
        Lidar, PostGIS, Postgresql, Qlikview, Scichart, Serilog, Topology, WMS'
    - date: Measurement system
      name: '[Location measurement system for measurement train](https://expertise.matdata.eu/\#/page/Location\%20measurement\%20system\%20for\%20measurement\%20train)'
      highlights:
      - Location measurement of a measurement train is very important. The usability
        of the other measurement systems depend on the ability to locate the measurement.
        Before this project, each measurement system had it's own GNSS antenna, odometer
        sensor and so on. And not to mention its own quality of the location. The
        inhouse project developed a measurement system that is independent of any
        other and is optimised for railway vehicles.
      - '**Roles**: Data architect, DevOps engineer, Developer, Project lead, Technician'
      - '**Technologies**: GNSS, GPSD, Git, Grafana, IMU, Odometry, Prometheus, Python,
        Raspberry Pi, SSH'
    - date: Data processing
      name: '[Location post processing system for railway vehicles](https://expertise.matdata.eu/\#/page/Location\%20post\%20processing\%20system\%20for\%20railway\%20vehicles)'
      highlights:
      - Train vehicle locations arrives as GNSS positions. Depending on the quality
        of the hardware, a reliable and accurate position is not always guaranteed.
        The post processing system will handle a location collection from a train
        path and use all available information sources, such as signaling train detection
        information, in order to improve the quality of the location. This is very
        important for other infrastructure measurements.
      - '**Roles**: Business analyst, Data architect, Developer, Project lead'
      - '**Technologies**: Dbeaver, GNSS, Git, Gitlab CI CD, IMU, Odometry, Openshift,
        PgRouting, PostGIS, Postgresql, QGIS, RTM, S3, Serilog, Topology'
    - date: Data processing
      name: '[Mapping train statistic on RINF data model](https://expertise.matdata.eu/\#/page/Mapping\%20train\%20statistic\%20on\%20RINF\%20data\%20model)'
      highlights:
      - The EU requests publishing data based on the RINF data model. Our train statistics
        data model is not using the RINF model as a basis. A translation system was
        set up to convert from one model into the other allowing to comply with EU
        requirements.
      - '**Roles**: Data analyst, Data architect, Developer'
      - '**Technologies**: Dbeaver, ERA ontology, Excel, Git, PgRouting, Plpgsql,
        Postgresql, QGIS, RTM, SPARQL'
    - date: Data processing
      name: '[Measurement train image post processing](https://expertise.matdata.eu/\#/page/Measurement\%20train\%20image\%20post\%20processing)'
      highlights:
      - Several measurement trains are equipped with camera's that capture the railway
        infrastructure from different angles. These images are timestamped, but not
        necessary positioned. The goal of this project is to create an automatic image
        processing service that positions the image, based on its timestamp, the position
        of the camera in the vehicle and the position of the vehicle.
      - '**Roles**: Business analyst, Data architect, Developer, Project lead'
      - '**Technologies**: GNSS, Git, Gitlab CI CD, Openshift, S3, Serilog'
    - date: Mobile app
      name: '[Mobile app for geolocated technical assistance](https://expertise.matdata.eu/\#/page/Mobile\%20app\%20for\%20geolocated\%20technical\%20assistance)'
      highlights:
      - This was the first mobile application of the enterprise. It's a GIS application,
        working very similar to a Map application. The user can interact with the
        map, search for assets, get directions, report incidents, ... Very important
        features of the app were the ability to visualise defect axle counters. This
        mostly happened during works and with the mobile app, the work teams have
        the ability to repair the issue before the track enters back into service
        (which would cause a significant amount of delays). Also requesting the technical
        designs or the traffic management system viewer based on your location is
        possible.
      - '**Roles**: Business analyst, Data architect, Developer, Project lead, Teamlead'
      - '**Technologies**: Android, Azure, Fastlane, GNSS, Git, Gitlab CI CD, JSON
        API, SSH, VueJs, iOS'
    - date: Mobile app
      name: '[Mobile app: synced documentation](https://expertise.matdata.eu/\#/page/Mobile\%20app\%3A\%20synced\%20documentation)'
      highlights:
      - A mobile app for catenary technicians for documentation lookup that is accessible
        offline and synced when online. The app uses Git to accomplish the syncing.
      - '**Roles**: Business analyst, Data architect, DevOps engineer'
      - '**Technologies**: Android, Fastlane, Git, iOS'
    - date: Strategy
      name: '[Model for FTE calculation of OCL technicians](https://expertise.matdata.eu/\#/page/Model\%20for\%20FTE\%20calculation\%20of\%20OCL\%20technicians)'
      highlights:
      - 'The enterprise is divided into about 15 workcenters. Each workcenter is assigned
        a certain resource amount, expressed in full time equivalents and number of
        worktrains. Each workcenter has also a certain amount of workload, expressed
        in number of assets and their maintenance charge. The project had as goal
        to create an objective and as realistic as possible model to calculate the
        absolute resource need for each workcenter. Simulations should also be possible:
        what if workcenters would merge, what if maintenance load increased, what
        if new assets were assigned, ...'
      - '**Roles**: Business analyst, Data analyst, Data architect, Developer, Project
        lead'
      - '**Technologies**: Dbeaver, Excel, Oracle, Postgresql, SQL, VBA'
    - date: Data management app
      name: '[OCL sectioning (topology) management application](https://expertise.matdata.eu/\#/page/OCL\%20sectioning\%20\(topology\)\%20management\%20application)'
      highlights:
      - A frontend GIS (graphical) management application running in QGIS to build
        and update the sectioning database of the overhead contact line. The base
        layer is the track topology on which a layer of sectioning elements and cables
        are attached. A backend program creates a sectioning topology from these singular
        and linear elements that is linked to the track topology. The resulting data-centric
        inventory is then used for calculating the electrified length of the network,
        for safety sheets or even for validating request for putting out of service.
      - '**Roles**: Business analyst, Data architect, Developer'
      - '**Technologies**: Data centricity, Dbeaver, Git, PgRouting, Plpgsql, PostGIS,
        Postgresql, QGIS, RTM, Railway, Topology'
    - date: Strategy
      name: '[Openrail](https://expertise.matdata.eu/\#/page/Openrail)'
      highlights:
      - The Openrail foundation is an opensource initiative started by OBB, DB, SNCF
        and UIC. As I am a big supporter of opensource, European initiatives, I managed
        to convince my company to join the Openrail foundation. I took upon myself
        a role in the technical committee to represent my company and opensource one
        of our projects.
      - '**Roles**: Business analyst, Company representative, SPOC data for department
        of 9000 employees'
      - '**Technologies**: Project management, Railway'
    - date: Measurement system
      name: '[Pantograph shock detection system](https://expertise.matdata.eu/\#/page/Pantograph\%20shock\%20detection\%20system)'
      highlights:
      - A measurement systems deployed on about 15 commercial vehicles. The purpose
        is to detect shocks happening due to pantograph/catenary interaction. The
        measurement system consists of accelerometers on the pantograph head on high
        voltage and a low voltage system inside the train. Both communicate wirelessly.
        Every shock is transmitted and analysed by a server side centrally and self
        developed system. The biggest innovation is the method used for grouping the
        alerts. The location associated with the shock depends on the placement of
        the GNSS antenna compared to the pantograph head and on the orientation of
        the vehicle. Several other business rules are important as well to make this,
        relatively big data system, business usable. But at the end of project, it
        became fully integrated with the work management system and workorders were
        automatically created when possible.
      - '**Roles**: Business analyst, Data analyst, Data architect, Developer, Project
        lead, Technician'
      - '**Technologies**: Accelerometers, Firewall, GNSS, Git, Gitlab CI CD, Loki,
        Openshift, Plpgsql, PostGIS, PowerBI, QGIS, Qlikview, RTM, Railway, SSH, Serilog,
        Topology'
    - date: Data processing
      name: '[Pole inventory management system](https://expertise.matdata.eu/\#/page/Pole\%20inventory\%20management\%20system)'
      highlights:
      - The legacy measurement system was file based and project specific. We went
        to a database based system with a QGIS management layer. A data quality improvement
        campaign was launched to improve the inventory based on measurement registrations
        of overhead structure. Pole naming was improved based on camera systems and
        AI detections.
      - '**Roles**: Data analyst, Developer, Project lead, Teamlead'
      - '**Technologies**: Dbeaver, LRS, PostGIS, Postgresql, QGIS, Railway, WMS'
    - date: Data processing
      name: '[PostGIS: GIS to LRS calculation library](https://expertise.matdata.eu/\#/page/PostGIS\%3A\%20GIS\%20to\%20LRS\%20calculation\%20library)'
      highlights:
      - The goal of the project was a set of database functions to allow conversion
        between geographic coordinates, schematic coordinates, intrinsic coordinates
        and linear referencing (LRS) coordinates. Not only for points but also for
        linear segments and area's.
      - '**Roles**: Data analyst, Data architect, Developer, Project lead'
      - '**Technologies**: Git, LRS, PgRouting, Plpgsql, PostGIS, Postgresql, RTM,
        Railway, Topology'
    - date: Data processing
      name: '[Post processing of binary linear measurement file](https://expertise.matdata.eu/\#/page/Post\%20processing\%20of\%20binary\%20linear\%20measurement\%20file)'
      highlights:
      - A measurement train contains many measurement systems that collect a lot of
        data. In order to reduce the amount of bytes, the data is mostly written into
        binary files having a specific binary structure. The goal of this project
        is to automatically read the binary files and write the data into a usable
        system such as a database.
      - '**Roles**: Business analyst, Data analyst, Data architect, Developer, Project
        lead'
      - '**Technologies**: Binary, ClickOnce, Git, Gitlab CI CD, Postgresql'
    - date: Strategy
      name: '[Product owner: enterprise GIS tooling](https://expertise.matdata.eu/\#/page/Product\%20owner\%3A\%20enterprise\%20GIS\%20tooling)'
      highlights:
      - Ensuring the proper usage of resources. Building the right things. Having
        a complete and clear roadmap.
      - '**Roles**: Data architect, Project lead, SPOC data for department of 9000
        employees, Teamlead'
      - '**Technologies**: Jira, Oracle, PostGIS, Project management, QGIS, RTM'
    - date: Business process
      name: '[Product owner: railway micro-topology management platform](https://expertise.matdata.eu/\#/page/Product\%20owner\%3A\%20railway\%20micro-topology\%20management\%20platform)'
      highlights:
      - The track microtopology topology is a very important data aspect for a railway
        infrastructure manager. It's without a doubt, THE data foundation. The process
        needs to run smoothly, errors need to be corrected ASAP and clients need to
        be heard.
      - '**Roles**: Business analyst, Product owner, SPOC data for department of 9000
        employees, Teamlead'
      - '**Technologies**: AutoCAD suite, Data centricity, Jira, LandXML, Oracle,
        RTM, Railway, Topology'
    - date: Strategy
      name: '[Product owner: work management system OCL](https://expertise.matdata.eu/\#/page/Product\%20owner\%3A\%20work\%20management\%20system\%20OCL)'
      highlights:
      - A work management systems allows the planning of workorders and is necessary
        to lower the administrative burden on technicians. The system has a time table
        (dates as columns and people as rows) for availability planning, an inventory
        with maintenance requirements, an incident reporting environment and a workorder
        system to link everything together. The system requires many types of reporting
        and interfacing with other systems.
      - '**Roles**: Business analyst, Data analyst, Product owner, Project lead'
      - '**Technologies**: Git, Java, Oracle, Oracle Forms, Project management, Qlikview,
        SAP CATS, SAP CO, SAP PM'
    - date: Strategy
      name: '[RCM-DX](https://expertise.matdata.eu/\#/page/RCM-DX)'
      highlights:
      - Measurement systems on the market for railway mostly use a proprietary data
        exchange format. This creates a digitalisation barrier. RCM-DX aims to standardise
        the data exchange format of linear measurements. This is an opensource project.
      - '**Roles**: Data analyst, Teamlead'
      - '**Technologies**: Binary, HDF5, RCM-DX format'
    - date: Semantic
      name: '[RailML ontology workgroup](https://expertise.matdata.eu/\#/page/RailML\%20ontology\%20workgroup)'
      highlights:
      - The workgroup aims to create an ontology for the railML data exchange format.
      - '**Roles**: Ontologist'
      - '**Technologies**: Git, Nextcloud, OWL, Protege, RDF, RTM, RailML, Railway,
        SHACL, SPARQL, Widoco'
    - date: Business process
      name: '[Setup PMO office](https://expertise.matdata.eu/\#/page/Setup\%20PMO\%20office)'
      highlights:
      - At the time of the start of the project, project management was not done very
        professionally at the enterprise for development projects. Granted, that is
        a very difficult type of project to manage due to its complexity. The goal
        of setting up the PMO office was to give a central support and a way to connect
        people with similar issues. Management also wanted reporting, so that was
        also set up using the PMO system.
      - '**Roles**: Business analyst, Project lead'
      - '**Technologies**: Data centricity, Data governance, MS Project, Project management'
    - date: Data management app
      name: '[Shelter GIS position management system](https://expertise.matdata.eu/\#/page/Shelter\%20GIS\%20position\%20management\%20system)'
      highlights:
      - A data management application in QGIS to manage the geographic location of
        shelters (containing signaling or power equipment). Several different sources
        of data are available for the user to manage the relevant data, including
        GPS coordinates of inspections of the shelters and satelite images.
      - '**Roles**: Data analyst, Data architect, Developer'
      - '**Technologies**: Dbeaver, Git, ODK, Plpgsql, PostGIS, Postgresql, PowerBI,
        QGIS, Topology, WMS'
    - date: Data processing
      name: '[Signaling topology calculation program](https://expertise.matdata.eu/\#/page/Signaling\%20topology\%20calculation\%20program)'
      highlights:
      - Having a track micro topology is a solid foundation for railway infrastructure
        data. But for some applications, reworking that topology into a signaling
        topology simplifies the usage. The goal of this project was to do this rework
        and publish the resulting topology.
      - '**Roles**: Business analyst, Data architect, Developer, Project lead'
      - '**Technologies**: Git, PgRouting, PostGIS, QGIS, RTM, Railway, Topology'
    - date: Business process
      name: '[Strategic project reporting](https://expertise.matdata.eu/\#/page/Strategic\%20project\%20reporting)'
      highlights:
      - 'A periodic relevant reporting on the status of strategic projects was requested
        by the upper management. A special focus was put on change and issue reporting.
        Projects were categorized into two types: development and roll-out programs.
        A prioritisation model was also developed to objectively score projects for
        attention and resource reasons.'
      - '**Roles**: Business analyst, Data architect, Developer, Project lead'
      - '**Technologies**: Dbeaver, MS Project, PMO, Postgresql, Project management,
        Qlikview, Sharepoint'
    - date: Business process
      name: '[Topologie to be](https://expertise.matdata.eu/\#/page/Topologie\%20to\%20be)'
      highlights:
      - The goal of the project was to ensure that micro topology data was available
        at the time of creation, many years before the topology change would get into
        service. For this a new business process needs to be put in place with enhanced
        tooling. The result would be an increased data centric foundation. The design
        process for new equipment is not well connected with the micro topology since
        the AS IS topology is insufficient for them. Publishing the TO BE micro topology
        data would allow them to position the new assets already on the correct topologic
        location. That will give a snowball effect of data centric benefits.
      - '**Roles**: Business analyst, Data architect, Project lead'
      - '**Technologies**: AutoCAD suite, Data centricity, Git, Jira, RTM, Topology'
    - date: Data processing
      name: '[Trainannouncer](https://expertise.matdata.eu/\#/page/Trainannouncer)'
      highlights:
      - A backend system using the train detection system to announce the train number
        to measurement systems. The train detection data arrives on a message queue,
        this queue is continuously read and processed for relevant messages. When
        train enters or exists a zone with a measurement system, the announcer will
        send this data to the measurement system. The measurement system uses this
        information for immediate action (pulling the train aside) or predictive actions
        (worn carbon of the pantograph).
      - '**Roles**: Data architect, DevOps engineer, Developer'
      - '**Technologies**: Dbeaver, Git, Gitlab CI CD, IBM MQ, Openshift, Postgresql,
        PowerBI, SSH, Serilog'
    - date: Webapp
      name: '[Webapp for digital inspection](https://expertise.matdata.eu/\#/page/Webapp\%20for\%20digital\%20inspection)'
      highlights:
      - The goal of the project is to create a webapp that allows users to perform
        a digital inspection of the railway infrastructure. The app is GIS based,
        it shows the railway network and works very similar to Google streetview.
        The user clicks a location and can look around. Features are available to
        annotate the location. AI detections and Lidar interaction is also possible.
      - '**Roles**: Business analyst, Data architect, Project lead'
      - '**Technologies**: Angular, Dbeaver, Git, Gitlab CI CD, JSON API, Lidar, Loki,
        Nginx, Plpgsql, PostGIS, Postgresql, Railway, Reverse proxy, SQL, Serilog,
        WMS'
    - date: Planningtool
      name: '[Webapp on SAP PM for workorder and ressource planning](https://expertise.matdata.eu/\#/page/Webapp\%20on\%20SAP\%20PM\%20for\%20workorder\%20and\%20ressource\%20planning)'
      highlights:
      - SAP is not a very user friendly system. The available tools to perform planning
        of workorders are insufficient for railway purposes. Thus a new web application
        was designed and interfaced with SAP backend. This project is part of a "planningtools"
        program to improve the business process and optimise the use of resources.
      - '**Roles**: Data architect, Project lead'
      - '**Technologies**: Azure, Logseq, SAP PM'
    - date: Webapp
      name: '[Webapp: OCL safety sheets](https://expertise.matdata.eu/\#/page/Webapp\%3A\%20OCL\%20safety\%20sheets)'
      highlights:
      - The goal was to replace an old fashioned system with technical limitations
        (certainly concerning interfacing and access) with a modern web application.
        The application consists of an API that returns "dangerous places" and other
        sectioning information of the overhead contact line. The web application allows
        to easily query the API and print a pdf.
      - '**Roles**: Business analyst, Data architect, DevOps engineer, Developer'
      - '**Technologies**: Angular, Git, JSON API, Openshift, Oracle Forms'
    - date: Webapp
      name: '[Webapp: common path of several railway vehicles](https://expertise.matdata.eu/\#/page/Webapp\%3A\%20common\%20path\%20of\%20several\%20railway\%20vehicles)'
      highlights:
      - Sometimes, multiple railway vehicles are discovered with damages on the same
        location, for example 30cm out of center of the pantograph. This is a clear
        sign of an infrastructure issue. In order to narrow down the location of the
        infrastructure problem, the train paths are visualised on a map that is common
        to all the vehicle. The challenging part of this project is to find a sufficiently
        detailed trainpath and a relation between the vehicle and the trains in which
        it served.
      - '**Roles**: Business analyst, Data architect, DevOps engineer, Project lead'
      - '**Technologies**: Angular, Docker, Git, Gitlab CI CD, JSON API, Nginx, Openshift,
        PgRouting, Topology, WMS'
    - date: Webapp
      name: '[Webapp: train protection system](https://expertise.matdata.eu/\#/page/Webapp\%3A\%20train\%20protection\%20system)'
      highlights:
      - A (work)traindriver that comes out of a track out of service, needs to configure
        his vehicle to the correct TPS system (TBL1+ or ETCS L1 LS, L1 FS, L2). This
        webapp allows the driver to correct locate himself on the track topology,
        using either a signal or his GPS position and give a driving direction. The
        app will then calculate the TPS level. The challenge of this project was to
        inventorise the TPS systems on the topology and create a routing algorithm
        using business logic to find "the next signal" on the trainpath, returning
        multiple if applicable. The TPS inventory is also used as an opendata dataset.
      - '**Roles**: Business analyst, Data architect, DevOps engineer, Project lead'
      - '**Technologies**: ADFS, Angular, Docker, Firewall, GNSS, Git, Gitlab CI CD,
        JSON API, Openshift, PgRouting, PostGIS, QGIS, Reverse proxy'
